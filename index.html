<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fffcf0" />
    <title>Feet & Inches Calculator</title>
    <style>
      :root {
        /* neutrals */
        --bg: #fffcf0; /* paper */
        --bg-2: #f2f0e5; /* base-50 */
        --ui: #e6e4d9; /* base-100 */
        --ui-2: #dad8ce; /* base-150 */
        --ui-3: #cecdc3; /* base-200 */
        --tx: #100f0f; /* black */
        --tx-2: #6f6e69; /* base-600 */
        --tx-3: #575653; /* base-700 */

        /* accent colours */
        --re: #af3029;
        --or: #bc5215;
        --ye: #ad8301;
        --gr: #66800b;
        --cy: #24837b;
        --bl: #205ea6;
        --pu: #5e409d;
        --ma: #a02f6f;

        --bg-color: var(--bg);
        --text-color: var(--tx);
        --table-border: var(--ui);
        --th-bg: var(--ui-2);
        --tr-even: var(--bg-2);
        --placeholder: var(--tx-2);
        --border: var(--ui-2);
      }

      body {
        font-family: monospace;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background: var(--bg-color);
        color: var(--text-color);
      }

      .tol-bar {
        text-align: right;
        margin-bottom: 10px;
      }

      .tol-btn {
        display: inline-block;
        padding: 4px 8px;
        margin-left: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-color);
        cursor: pointer;
        user-select: none;
        font-family: monospace;
        font-size: 14px;
        line-height: 18px;
      }

      .tol-btn.active {
        background: var(--th-bg);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid var(--table-border);
        padding: 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: var(--th-bg);
        text-align: center;
      }

      tr:nth-child(even) {
        background: var(--tr-even);
      }

      .input-cell {
        background: var(--bg);
        position: relative;
      }

      #liveInputCell {
        box-shadow: inset 0 0 0 2px lightblue;
      }

      #box {
        background: var(--bg);
        border: none;
        color: var(--tx);
      }

      .input-cell input {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        color: var(--text-color);
        outline: none;
      }

      .placeholder input::placeholder {
        color: var(--placeholder);
      }

      .del {
        display: flex;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid #999;
        background: #e22;
        color: #fff;
        font-size: 14px;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }

      .del:hover,
      .del:focus {
        transform: translateY(-50%);
        top: 50%;
      }

      tr:hover .del,
      tr:focus-within .del,
      .del:hover,
      .del:focus {
        opacity: 1;
        pointer-events: auto;
      }

      .error {
        color: red;
        min-height: 20px;
        margin-top: 6px;
      }

      .calc-value,
      .input-copy {
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .calc-value:hover,
      .input-copy:hover {
        cursor: copy;
        background: color-mix(in srgb, var(--th-bg) 45%, transparent);
      }

      .calc-value:active,
      .input-copy:active {
        background: color-mix(in srgb, var(--th-bg) 65%, transparent);
      }

      /* On-screen keypad is hidden on desktop; shown on small screens. */
      .keypad {
        display: none;
      }

      /* ---------- Mobile layout ---------- */
      @media (max-width: 820px) {
        body {
          padding: 12px 12px 0;
          /* space for the fixed keypad; refined in JS to its real height */
          padding-bottom: 320px;
          -webkit-text-size-adjust: 100%;
        }

        h1 {
          font-size: 1.15rem;
          margin: 2px 0 10px;
        }

        /* precision selector fits all steps across one row */
        .tol-bar {
          text-align: left;
          display: flex;
          gap: 2px;
          margin-bottom: 8px;
        }
        .tol-btn {
          margin-left: 0;
          flex: 1 1 0;
          min-width: 0;
          padding: 7px 1px;
          font-size: 10.5px;
          line-height: 1;
          text-align: center;
          white-space: nowrap;
        }

        .error {
          margin: 0 0 8px;
        }

        /* collapse the wide table into stacked cards */
        thead {
          display: none;
        }
        #tbl,
        #tbl tbody {
          display: block;
          width: 100%;
        }

        #tbl tbody tr {
          display: grid;
          grid-template-columns: 1fr 1fr;
          border: 1px solid var(--border);
          margin-bottom: 8px;
          background: var(--bg);
        }
        /* drop the desktop zebra striping in card mode */
        #tbl tbody tr:nth-child(even) {
          background: var(--bg);
        }

        #tbl tbody td {
          display: block;
          border: none;
          border-top: 1px solid var(--table-border);
          padding: 8px 10px;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        /* the input / expression cell spans the full card width */
        .input-cell {
          grid-column: 1 / -1;
          border-top: none !important;
        }
        .input-copy {
          padding-right: 40px;
        }

        /* label + value stacked for each output */
        .calc-value::before {
          content: attr(data-label);
          display: block;
          font-size: 10px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--tx-2);
          margin-bottom: 3px;
        }
        .calc-value {
          font-size: 15px;
          min-height: 2.6em;
        }
        /* divider between the two output columns */
        .calc-value:nth-child(even) {
          border-right: 1px solid var(--table-border);
        }

        /* live input row = pinned "active" panel */
        #liveRow {
          position: sticky;
          top: 0;
          z-index: 5;
          border: 2px solid var(--bl);
          box-shadow: 0 2px 10px rgba(16, 15, 15, 0.1);
        }
        #liveInputCell {
          box-shadow: none;
        }
        #box {
          font-size: 18px;
          padding: 4px 2px;
        }

        /* delete control is always reachable on touch */
        #tbl tbody .del {
          opacity: 1;
          pointer-events: auto;
        }

        /* ---------- keypad ---------- */
        .keypad {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          background: var(--ui);
          border-top: 1px solid var(--ui-3);
          padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
          z-index: 20;
        }
        .keys {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 6px;
          max-width: 520px;
          margin: 0 auto;
        }
        .key {
          font-family: monospace;
          font-size: 20px;
          line-height: 1;
          padding: 14px 0;
          border: 1px solid var(--ui-3);
          background: var(--bg);
          color: var(--tx);
          border-radius: 7px;
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
        }
        .key:active {
          background: var(--ui-2);
        }
        .key.mark {
          color: var(--cy);
          font-weight: bold;
        }
        .key.op {
          color: var(--or);
        }
        .key[data-k="0"] {
          grid-column: span 2;
        }
        /* full-color utility keys */
        .key.back {
          grid-column: span 1;
          background: var(--re);
          color: var(--bg);
          border-color: var(--re);
        }
        .key.space {
          grid-column: span 2;
          background: var(--tx-2);
          color: var(--bg);
          border-color: var(--tx-2);
        }
        .key.equals {
          grid-column: span 2;
          background: var(--bl);
          color: var(--bg);
          border-color: var(--bl);
          font-weight: bold;
        }
        .key.back:active {
          background: color-mix(in srgb, var(--re) 82%, black);
        }
        .key.space:active {
          background: color-mix(in srgb, var(--tx-2) 82%, black);
        }
        .key.equals:active {
          background: color-mix(in srgb, var(--bl) 82%, black);
        }
      }

      /* keypad never intercepts input on devices with a real pointer */
      @media (min-width: 821px) {
        .keypad {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>Feet and Inches Calculator</h1>
    <div class="tol-bar" role="group" aria-label="Rounding precision">
      <button class="tol-btn" data-den="2" aria-pressed="false">1/2&#8243;</button>
      <button class="tol-btn" data-den="4" aria-pressed="false">1/4&#8243;</button>
      <button class="tol-btn" data-den="8" aria-pressed="false">1/8&#8243;</button>
      <button class="tol-btn active" data-den="16" aria-pressed="true">1/16&#8243;</button>
      <button class="tol-btn" data-den="32" aria-pressed="false">1/32&#8243;</button>
      <button class="tol-btn" data-den="64" aria-pressed="false">1/64&#8243;</button>
      <button class="tol-btn" data-den="128" aria-pressed="false">1/128&#8243;</button>
      <button class="tol-btn" data-den="256" aria-pressed="false">1/256&#8243;</button>
    </div>
    <div class="error" id="err" aria-live="assertive"></div>
    <div class="history">
      <table id="tbl">
        <thead>
          <tr>
            <th rowspan="2" colspan="4">Input</th>
            <th colspan="2">Feet</th>
            <th colspan="2">Inches</th>
          </tr>
          <tr>
            <th>Fractional</th>
            <th>Decimal</th>
            <th>Fractional</th>
            <th>Decimal</th>
          </tr>
        </thead>
        <tbody>
          <tr id="liveRow" class="placeholder">
            <td id="liveInputCell" class="input-cell" colspan="4">
              <input
                id="box"
                placeholder="5&#8217; + 3 1/4&#8243; or (1.5&#8217; * 2)"
                autocomplete="off"
                title="Double-click to copy"
              />
            </td>
            <td id="fFt" class="calc-value" data-label="Ft-In (frac)" title="Click to copy"></td>
            <td id="dFt" class="calc-value" data-label="Feet (dec)" title="Click to copy"></td>
            <td id="fIn" class="calc-value" data-label="Inches (frac)" title="Click to copy"></td>
            <td id="dIn" class="calc-value" data-label="Inches (dec)" title="Click to copy"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <template id="row-tpl">
      <tr data-inches="">
        <td class="input-cell input-copy" colspan="4" title="Click to copy">
          <button class="del" aria-label="Delete row">X</button><span class="expr"></span>
        </td>
        <td class="fFeet calc-value" data-label="Ft-In (frac)" title="Click to copy"></td>
        <td class="dFt calc-value" data-label="Feet (dec)" title="Click to copy"></td>
        <td class="fInch calc-value" data-label="Inches (frac)" title="Click to copy"></td>
        <td class="dIn calc-value" data-label="Inches (dec)" title="Click to copy"></td>
      </tr>
    </template>
    <div class="keypad" id="keypad" aria-label="Calculator keypad">
      <div class="keys">
        <button class="key back" data-k="back" aria-label="backspace">&#9003;</button>
        <button class="key mark" data-k="&quot;" aria-label="inch mark">&Prime;</button>
        <button class="key mark" data-k="'" aria-label="feet mark">&prime;</button>
        <button class="key op" data-k="(">(</button>
        <button class="key op" data-k=")">)</button>

        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key op" data-k="/" aria-label="divide">&divide;</button>
        <button class="key op" data-k="*" aria-label="multiply">&times;</button>

        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key op" data-k="-" aria-label="minus">&minus;</button>
        <button class="key op" data-k="+" aria-label="plus">+</button>

        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key space" data-k=" " aria-label="space">&#9251;</button>

        <button class="key" data-k="0">0</button>
        <button class="key" data-k=".">.</button>
        <button class="key equals" data-k="=" aria-label="calculate">=</button>
      </div>
    </div>
    <script type="module">
      import { parseInput, formatOutputs } from "./calc.js";

      const dens = [2, 4, 8, 16, 32, 64, 128, 256];
      let active = 3;
      let DEN = dens[active];

      const tolBtns = [...document.querySelectorAll(".tol-btn")];
      const box = document.getElementById("box");
      const err = document.getElementById("err");
      const historyBody = document.querySelector("#tbl tbody");
      const liveRow = document.getElementById("liveRow");
      const fFtEl = document.getElementById("fFt");
      const dFtEl = document.getElementById("dFt");
      const fInEl = document.getElementById("fIn");
      const dInEl = document.getElementById("dIn");
      const rows = [];
      function clearLiveOutputs() {
        [fFtEl, dFtEl, fInEl, dInEl].forEach((el) => {
          el.textContent = "";
        });
      }

      function refreshLive() {
        err.textContent = "";
        const expr = box.value.trim();
        if (!expr) {
          clearLiveOutputs();
          liveRow.classList.add("placeholder");
          return;
        }
        liveRow.classList.remove("placeholder");
        try {
          const out = formatOutputs(parseInput(expr), DEN);
          fFtEl.textContent = out.fFt;
          dFtEl.textContent = out.dFt;
          fInEl.textContent = out.fIn;
          dInEl.textContent = out.dIn;
        } catch (e) {
          clearLiveOutputs();
        }
      }

      async function copyText(text) {
        if (!text) return;
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      async function copyCalculatedValue(target) {
        const value =
          target instanceof HTMLInputElement
            ? target.value.trim()
            : target.classList.contains("input-copy")
            ? target.querySelector(".expr").textContent.trim()
            : target.textContent.trim();
        if (!value) return;
        try {
          await copyText(value);
          err.textContent = `Copied: ${value}`;
        } catch {
          err.textContent = "Could not copy to clipboard.";
        }
      }

      box.addEventListener("input", () => {
        err.textContent = "";
        refreshLive();
      });

      box.addEventListener("dblclick", () => {
        copyCalculatedValue(box);
      });

      function commitInput() {
        const expr = box.value.trim();
        if (!expr) {
          err.textContent = "Input cannot be empty.";
          return;
        }
        try {
          const tot = parseInput(expr);
          addRow(expr, tot);
          box.value = "";
          err.textContent = "";
          refreshLive();
        } catch (ex) {
          err.textContent = ex.message || ex;
        }
      }

      box.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        commitInput();
      });

      document.addEventListener("click", (e) => {
        const cell = e.target.closest(".calc-value");
        if (cell) {
          copyCalculatedValue(cell);
          return;
        }

        const inputCell = e.target.closest(".input-copy");
        if (inputCell && !e.target.closest(".del")) {
          copyCalculatedValue(inputCell);
        }
      });

      function addRow(expr, tot) {
        const out = formatOutputs(tot, DEN);
        const tpl = document.getElementById("row-tpl").content.cloneNode(true);
        const tr = tpl.querySelector("tr");
        tr.dataset.inches = tot;
        tr.querySelector(".expr").textContent = expr;
        tr.querySelector(".fFeet").textContent = out.fFt;
        tr.querySelector(".dFt").textContent = out.dFt;
        tr.querySelector(".fInch").textContent = out.fIn;
        tr.querySelector(".dIn").textContent = out.dIn;
        tr.querySelector(".del").addEventListener("click", () => {
          historyBody.removeChild(tr);
          rows.splice(rows.indexOf(tr), 1);
        });
        historyBody.insertBefore(tr, liveRow.nextSibling);
        rows.push(tr);
      }

      function refreshHistory() {
        rows.forEach((tr) => {
          const out = formatOutputs(parseFloat(tr.dataset.inches), DEN);
          tr.querySelector(".fFeet").textContent = out.fFt;
          tr.querySelector(".dFt").textContent = out.dFt;
          tr.querySelector(".fInch").textContent = out.fIn;
          tr.querySelector(".dIn").textContent = out.dIn;
        });
      }

      function setDen(idx) {
        active = idx;
        DEN = dens[idx];
        tolBtns.forEach((b, i) => {
          const isActive = i === idx;
          b.classList.toggle("active", isActive);
          b.setAttribute("aria-pressed", String(isActive));
        });
        refreshLive();
        refreshHistory();
      }

      /* ---------- on-screen keypad (touch / small screens) ---------- */
      const keypad = document.getElementById("keypad");

      function insertAtCursor(text) {
        box.focus();
        const start = box.selectionStart ?? box.value.length;
        const end = box.selectionEnd ?? box.value.length;
        box.value = box.value.slice(0, start) + text + box.value.slice(end);
        const pos = start + text.length;
        box.setSelectionRange(pos, pos);
        err.textContent = "";
        refreshLive();
      }

      function backspace() {
        box.focus();
        let start = box.selectionStart ?? box.value.length;
        const end = box.selectionEnd ?? box.value.length;
        if (start === end) {
          if (start === 0) return;
          start -= 1;
        }
        box.value = box.value.slice(0, start) + box.value.slice(end);
        box.setSelectionRange(start, start);
        err.textContent = "";
        refreshLive();
      }

      // Keep the caret in the input when tapping keys (prevents blur/flicker).
      keypad.addEventListener("mousedown", (e) => {
        if (e.target.closest(".key")) e.preventDefault();
      });

      keypad.addEventListener("click", (e) => {
        const key = e.target.closest(".key");
        if (!key) return;
        if (key.classList.contains("back")) return backspace();
        if (key.classList.contains("equals")) return commitInput();
        insertAtCursor(key.dataset.k);
      });

      // Suppress the native virtual keyboard when the custom pad is active,
      // and reserve page space so the fixed keypad never covers content.
      const touchMode = window.matchMedia("(max-width: 820px)");
      function syncTouchMode() {
        if (touchMode.matches) {
          box.setAttribute("inputmode", "none");
          document.body.style.paddingBottom = keypad.offsetHeight + 16 + "px";
        } else {
          box.removeAttribute("inputmode");
          document.body.style.paddingBottom = "";
        }
      }
      touchMode.addEventListener("change", syncTouchMode);
      window.addEventListener("resize", syncTouchMode);
      syncTouchMode();

      tolBtns.forEach((b, i) => b.addEventListener("click", () => setDen(i)));
      document.addEventListener("keydown", (e) => {
        if (
          (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
          document.activeElement !== box
        ) {
          const dir = e.key === "ArrowLeft" ? -1 : 1;
          setDen((active + dir + dens.length) % dens.length);
        }
      });

      refreshLive();
    </script>
  </body>
</html>
