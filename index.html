<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feet & Inches Calculator</title>
    <style>
      :root {
        /* neutrals */
        --bg: #fffcf0; /* paper          */
        --bg-2: #f2f0e5; /* base‑50        */
        --ui: #e6e4d9; /* base‑100       */
        --ui-2: #dad8ce; /* base‑150       */
        --ui-3: #cecdc3; /* base‑200       */
        --tx: #100f0f; /* black          */
        --tx-2: #6f6e69; /* base‑600       */
        --tx-3: #575653; /* base‑700       */

        /* accent colours (grabbed straight from Flexoki if you need them) */
        --re: #af3029;
        --or: #bc5215;
        --ye: #ad8301;
        --gr: #66800b;
        --cy: #24837b;
        --bl: #205ea6;
        --pu: #5e409d;
        --ma: #a02f6f;

        /* map to your existing custom properties so nothing else needs editing */
        --bg-color: var(--bg);
        --text-color: var(--tx);
        --table-border: var(--ui);
        --th-bg: var(--ui-2);
        --tr-even: var(--bg-2);
        --placeholder: var(--tx-2);
        --border: var(--ui-2);
      }

      body {
        font-family: monospace;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background: var(--bg-color);
      }
      .tol-bar {
        text-align: right;
        margin-bottom: 10px;
      }
      .tol-btn {
        display: inline-block;
        padding: 4px 8px;
        margin-left: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-color);
        cursor: pointer;
        user-select: none;
        font-family: monospace;
        font-size: 14px;
        line-height: 18px;
      }
      .tol-btn.active {
        background: var(--th-bg);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid var(--table-border);
        padding: 8px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: var(--th-bg);
        text-align: center;
      }
      tr:nth-child(even) {
        background: var(--tr-even);
      }
      .input-cell {
        background: var(--bg);
        position: relative;
      }
      #liveInputCell {
        box-shadow: inset 0 0 0 2px lightblue;
      }
      .input-cell input {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        color: var(--text-color);
        outline: none;
      }
      .placeholder input::placeholder {
        color: var(--placeholder);
      }
      .del {
        display: none;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid #999;
        background: #e22;
        color: #fff;
        font-size: 14px;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }
      .del:hover,
      .del:focus {
        transform: translateY(-50%);
        top: 50%;
      }

      tr:hover .del,
      .del:hover {
        /* keep the button’s flex centering instead of switching to block */
        display: flex;
      }
      .del-btn,
      .del-btn:hover,
      .del-btn:focus {
        transform: none !important; /* cancel any translate / scale */
        top: 0 !important; /* if earlier CSS nudged it      */
      }
      .error {
        color: red;
        min-height: 20px;
        margin-top: 6px;
      }
      #box input[type="text"] {
        background: var(--bg); /* Flexoki paper   */
        border: 1px solid var(--ui-2);
        color: var(--tx);
      }
    </style>
  </head>
  <body>
    <h1>Feet and Inches Calculator</h1>
    <div class="tol-bar">
      <button class="tol-btn" data-den="2">1/2″</button>
      <button class="tol-btn" data-den="4">1/4″</button>
      <button class="tol-btn" data-den="8">1/8″</button>
      <button class="tol-btn active" data-den="16">1/16″</button>
      <button class="tol-btn" data-den="32">1/32″</button>
      <button class="tol-btn" data-den="64">1/64″</button>
      <button class="tol-btn" data-den="128">1/128″</button>
      <button class="tol-btn" data-den="256">1/256″</button>
    </div>
    <div class="error" id="err" aria-live="assertive"></div>
    <div class="history">
      <table id="tbl">
        <thead>
          <tr>
            <th rowspan="2" colspan="4">Input</th>
            <th colspan="2">Feet</th>
            <th colspan="2">Inches</th>
          </tr>
          <tr>
            <th>Fractional</th>
            <th>Decimal</th>
            <th>Fractional</th>
            <th>Decimal</th>
          </tr>
        </thead>
        <tbody>
          <tr id="liveRow" class="placeholder">
            <td id="liveInputCell" class="input-cell" colspan="4">
              <input
                id="box"
                placeholder="5&#8217; + 3 1/4″ or (1.5&#8217; * 2)"
                autocomplete="off"
              />
            </td>
            <td id="fFt"></td>
            <td id="dFt"></td>
            <td id="fIn"></td>
            <td id="dIn"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <template id="row-tpl">
      <tr data-inches="">
        <td class="input-cell" colspan="4">
          <button class="del">X</button><span class="expr"></span>
        </td>
        <td class="fFeet"></td>
        <td class="dFt"></td>
        <td class="fInch"></td>
        <td class="dIn"></td>
      </tr>
    </template>
    <script type="module">
      const dens = [2, 4, 8, 16, 32, 64, 128, 256];
      let active = 3,
        DEN = dens[active];

      const QUOTE_FT = "[\\'’′]"; // straight, curly apostrophe, prime
      const QUOTE_IN = '["”″]'; // straight, curly quote, double prime
      function normalize(s) {
        return s
          .replace(/[’‘′]/g, "'")
          .replace(/[“”″]/g, '"')
          .replace(/[×x]/gi, "*")
          .replace(/÷/g, "/")
          .replace(/[–—]/g, "-")
          .replace(/,/g, "")
          .replace(/\s*(['"’′″])\s*/g, "$1"); // ← added line
      }
      /* ─── feet / inch token regexes  (double‑escaped!) ──────────────────── */
      const RX_MIXED = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_FT}\\s*` +
          `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)?\\s*${QUOTE_IN}`,
        "g"
      );

      const RX_FT = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_FT}`,
        "g"
      );

      const RX_IN = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_IN}`,
        "g"
      );

      // Fractions without unit marks (e.g., "5 5/8", "3/4")
      const RX_MIXED_FRAC = /(-?\d+)\s+(\d+\/\d+)/g;
      const RX_PURE_FRAC = /-?\d+\/\d+/g;
      const tolBtns = [...document.querySelectorAll(".tol-btn")];
      const box = document.getElementById("box"),
        err = document.getElementById("err");
      let lastAttemptHadError = false;
      const historyBody = document.querySelector("#tbl tbody"),
        liveRow = document.getElementById("liveRow");
      const fFtEl = document.getElementById("fFt"),
        dFtEl = document.getElementById("dFt");
      const fInEl = document.getElementById("fIn"),
        dInEl = document.getElementById("dIn");
      const rows = [],
        gcd = (a, b) => (b ? gcd(b, a % b) : a);
      const roundNearest = (v, d) => Math.round(v * d) / d;

      const mixed = (val, d) => {
        const sign = val < 0 ? "-" : "";
        let abs = Math.abs(val);
        abs = roundNearest(abs, d);
        let whole = Math.floor(abs),
          frac = abs - whole;
        if (frac === 0) return sign + whole;
        let num = Math.round(frac * d),
          den = d;
        const g = gcd(num, den);
        num /= g;
        den /= g;
        return sign + (whole ? whole + " " : "") + num + "/" + den;
      };
      const in2ft = (inches) => ({
        ft: Math.floor(inches / 12),
        in: inches % 12,
      });

      function parseFrac(str) {
        str = str.trim();
        if (/^\-?\d+\s+\d+\/\d+$/.test(str)) {
          const [whole, frac] = str.split(/\s+/);
          const [num, den] = frac.split("/");
          return (
            Math.sign(parseFloat(whole)) *
            (Math.abs(parseFloat(whole)) + parseInt(num) / parseInt(den))
          );
        }
        if (/^-?\d+\/\d+$/.test(str)) {
          const [num, den] = str.split("/");
          return parseInt(num) / parseInt(den);
        }
        return parseFloat(str);
      }
      const pre = (s) =>
        normalize(s)
          .replace(
            RX_MIXED,
            (m, f, i) => parseFrac(f) * 12 + (i ? parseFrac(i) : 0)
          )
          .replace(RX_FT, (m, f) => parseFrac(f) * 12)
          .replace(RX_IN, (m, i) => parseFrac(i))
          .replace(RX_MIXED_FRAC, (m, w, f) => `(${w}+(${f}))`)
          .replace(RX_PURE_FRAC, (m) => `(${m})`);
      const evaluate = (expr) => {
        if (/[^0-9+\-*/().'"\s]/.test(expr))
          throw new SyntaxError("Invalid input");
        return Function(`"use strict";return (${expr})`)();
      };
      const parseInput = (s) => {
        const val = evaluate(pre(s));
        if (typeof val !== "number" || isNaN(val))
          throw new SyntaxError("Invalid result");
        return val;
      };

      const outputs = (tot) => {
        const sign = tot < 0 ? "-" : "";
        const abs = Math.abs(tot);
        let { ft, in: inch } = in2ft(abs);
        inch = roundNearest(inch, DEN);
        if (inch >= 12) {
          ft++;
          inch -= 12;
        }
        return {
          fFt: `${sign}${mixed(ft, DEN)}'-${mixed(inch, DEN)}"`,
          dFt: `${sign}${(abs / 12)
            .toFixed(5)
            .replace(/\.0+$|(?<=\d)0+$/, "")}'`,
          fIn: `${sign}${mixed(abs, DEN)}"`,
          dIn: `${sign}${abs.toFixed(5).replace(/\.0+$|(?<=\d)0+$/, "")}"`,
          raw: tot,
        };
      };

      function refreshLive() {
        err.textContent = "";
        const expr = box.value.trim();
        if (!expr) {
          [fFtEl, dFtEl, fInEl, dInEl].forEach((el) => (el.textContent = ""));
          liveRow.classList.add("placeholder");
          return;
        }
        liveRow.classList.remove("placeholder");
        try {
          const out = outputs(parseInput(expr));
          fFtEl.textContent = out.fFt;
          dFtEl.textContent = out.dFt;
          fInEl.textContent = out.fIn;
          dInEl.textContent = out.dIn;
        } catch (e) {
          /* ignore live parse errors */
        }
      }
      box.addEventListener("input", () => {
        err.textContent = ""; // keep banner clear during typing
        lastAttemptHadError = false;
        refreshLive();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const expr = box.value.trim();
        if (!expr) {
          err.textContent = "Input cannot be empty.";
          return;
        }
        try {
          const tot = parseInput(expr);
          addRow(expr, tot);
          box.value = "";
          err.textContent = "";
          refreshLive();
        } catch (ex) {
          err.textContent = ex.message || ex;
          lastAttemptHadError = true;
        }
      });

      function addRow(expr, tot) {
        const out = outputs(tot);
        const tpl = document.getElementById("row-tpl").content.cloneNode(true);
        const tr = tpl.querySelector("tr");
        tr.dataset.inches = tot;
        tr.querySelector(".expr").textContent = expr;
        tr.querySelector(".fFeet").textContent = out.fFt;
        tr.querySelector(".dFt").textContent = out.dFt;
        tr.querySelector(".fInch").textContent = out.fIn;
        tr.querySelector(".dIn").textContent = out.dIn;
        tr.querySelector(".del").addEventListener("click", () => {
          historyBody.removeChild(tr);
          rows.splice(rows.indexOf(tr), 1);
        });
        historyBody.insertBefore(tr, liveRow.nextSibling);
        rows.push(tr);
      }
      function refreshHistory() {
        rows.forEach((tr) => {
          const out = outputs(parseFloat(tr.dataset.inches));
          tr.querySelector(".fFeet").textContent = out.fFt;
          tr.querySelector(".dFt").textContent = out.dFt;
          tr.querySelector(".fInch").textContent = out.fIn;
          tr.querySelector(".dIn").textContent = out.dIn;
        });
      }
      function setDen(idx) {
        active = idx;
        DEN = dens[idx];
        tolBtns.forEach((b, i) => b.classList.toggle("active", i === idx));
        refreshLive();
        refreshHistory();
      }
      tolBtns.forEach((b, i) => b.addEventListener("click", () => setDen(i)));
      document.addEventListener("keydown", (e) => {
        if (
          (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
          document.activeElement !== box
        ) {
          const dir = e.key === "ArrowLeft" ? -1 : 1;
          setDen((active + dir + dens.length) % dens.length);
        }
      });
      refreshLive();
    </script>
  </body>
</html>
