<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feet & Inches Calculator</title>
    <style>
      :root {
        /* neutrals */
        --bg: #fffcf0; /* paper */
        --bg-2: #f2f0e5; /* base-50 */
        --ui: #e6e4d9; /* base-100 */
        --ui-2: #dad8ce; /* base-150 */
        --ui-3: #cecdc3; /* base-200 */
        --tx: #100f0f; /* black */
        --tx-2: #6f6e69; /* base-600 */
        --tx-3: #575653; /* base-700 */

        /* accent colours */
        --re: #af3029;
        --or: #bc5215;
        --ye: #ad8301;
        --gr: #66800b;
        --cy: #24837b;
        --bl: #205ea6;
        --pu: #5e409d;
        --ma: #a02f6f;

        --bg-color: var(--bg);
        --text-color: var(--tx);
        --table-border: var(--ui);
        --th-bg: var(--ui-2);
        --tr-even: var(--bg-2);
        --placeholder: var(--tx-2);
        --border: var(--ui-2);
      }

      body {
        font-family: monospace;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background: var(--bg-color);
        color: var(--text-color);
      }

      .tol-bar {
        text-align: right;
        margin-bottom: 10px;
      }

      .tol-btn {
        display: inline-block;
        padding: 4px 8px;
        margin-left: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-color);
        cursor: pointer;
        user-select: none;
        font-family: monospace;
        font-size: 14px;
        line-height: 18px;
      }

      .tol-btn.active {
        background: var(--th-bg);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        border: 1px solid var(--table-border);
        padding: 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: var(--th-bg);
        text-align: center;
      }

      tr:nth-child(even) {
        background: var(--tr-even);
      }

      .input-cell {
        background: var(--bg);
        position: relative;
      }

      #liveInputCell {
        box-shadow: inset 0 0 0 2px lightblue;
      }

      #box {
        background: var(--bg);
        border: none;
        color: var(--tx);
      }

      .input-cell input {
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        color: var(--text-color);
        outline: none;
      }

      .placeholder input::placeholder {
        color: var(--placeholder);
      }

      .del {
        display: flex;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid #999;
        background: #e22;
        color: #fff;
        font-size: 14px;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }

      .del:hover,
      .del:focus {
        transform: translateY(-50%);
        top: 50%;
      }

      tr:hover .del,
      tr:focus-within .del,
      .del:hover,
      .del:focus {
        opacity: 1;
        pointer-events: auto;
      }

      .error {
        color: red;
        min-height: 20px;
        margin-top: 6px;
      }

      .calc-value,
      .input-copy {
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      .calc-value:hover,
      .input-copy:hover {
        cursor: copy;
        background: color-mix(in srgb, var(--th-bg) 45%, transparent);
      }

      .calc-value:active,
      .input-copy:active {
        background: color-mix(in srgb, var(--th-bg) 65%, transparent);
      }
    </style>
  </head>
  <body>
    <h1>Feet and Inches Calculator</h1>
    <div class="tol-bar" role="group" aria-label="Rounding precision">
      <button class="tol-btn" data-den="2" aria-pressed="false">1/2&#8243;</button>
      <button class="tol-btn" data-den="4" aria-pressed="false">1/4&#8243;</button>
      <button class="tol-btn" data-den="8" aria-pressed="false">1/8&#8243;</button>
      <button class="tol-btn active" data-den="16" aria-pressed="true">1/16&#8243;</button>
      <button class="tol-btn" data-den="32" aria-pressed="false">1/32&#8243;</button>
      <button class="tol-btn" data-den="64" aria-pressed="false">1/64&#8243;</button>
      <button class="tol-btn" data-den="128" aria-pressed="false">1/128&#8243;</button>
      <button class="tol-btn" data-den="256" aria-pressed="false">1/256&#8243;</button>
    </div>
    <div class="error" id="err" aria-live="assertive"></div>
    <div class="history">
      <table id="tbl">
        <thead>
          <tr>
            <th rowspan="2" colspan="4">Input</th>
            <th colspan="2">Feet</th>
            <th colspan="2">Inches</th>
          </tr>
          <tr>
            <th>Fractional</th>
            <th>Decimal</th>
            <th>Fractional</th>
            <th>Decimal</th>
          </tr>
        </thead>
        <tbody>
          <tr id="liveRow" class="placeholder">
            <td id="liveInputCell" class="input-cell" colspan="4">
              <input
                id="box"
                placeholder="5&#8217; + 3 1/4&#8243; or (1.5&#8217; * 2)"
                autocomplete="off"
                title="Double-click to copy"
              />
            </td>
            <td id="fFt" class="calc-value" title="Click to copy"></td>
            <td id="dFt" class="calc-value" title="Click to copy"></td>
            <td id="fIn" class="calc-value" title="Click to copy"></td>
            <td id="dIn" class="calc-value" title="Click to copy"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <template id="row-tpl">
      <tr data-inches="">
        <td class="input-cell input-copy" colspan="4" title="Click to copy">
          <button class="del" aria-label="Delete row">X</button><span class="expr"></span>
        </td>
        <td class="fFeet calc-value" title="Click to copy"></td>
        <td class="dFt calc-value" title="Click to copy"></td>
        <td class="fInch calc-value" title="Click to copy"></td>
        <td class="dIn calc-value" title="Click to copy"></td>
      </tr>
    </template>
    <script type="module">
      const dens = [2, 4, 8, 16, 32, 64, 128, 256];
      let active = 3;
      let DEN = dens[active];

      const QUOTE_FT = "[\\'\\u2019\\u2032]"; // straight, curly apostrophe, prime
      const QUOTE_IN = '["\\u201d\\u2033]'; // straight, curly quote, double prime

      function normalize(s) {
        return s
          .replace(/[\u2019\u2018\u2032]/g, "'")
          .replace(/[\u201c\u201d\u2033]/g, '"')
          .replace(/[\u00d7x]/gi, "*")
          .replace(/\u00f7/g, "/")
          .replace(/[\u2013\u2014]/g, "-")
          .replace(/,/g, "")
          .replace(/\s*(['"\u2019\u2032\u2033])\s*/g, "$1");
      }

      const RX_MIXED = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_FT}\\s*` +
          `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)?\\s*${QUOTE_IN}`,
        "g"
      );
      const RX_FT = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_FT}`,
        "g"
      );
      const RX_IN = new RegExp(
        `(-?(?:\\d*\\.?\\d+)(?:\\s+\\d+\\/\\d+)?)\\s*${QUOTE_IN}`,
        "g"
      );

      // Fractions without unit marks (e.g., "5 5/8", "3/4")
      const RX_MIXED_FRAC = /(-?\d+)\s+(\d+\/\d+)/g;
      const RX_PURE_FRAC = /-?\d+\/\d+/g;
      const tolBtns = [...document.querySelectorAll(".tol-btn")];
      const box = document.getElementById("box");
      const err = document.getElementById("err");
      const historyBody = document.querySelector("#tbl tbody");
      const liveRow = document.getElementById("liveRow");
      const fFtEl = document.getElementById("fFt");
      const dFtEl = document.getElementById("dFt");
      const fInEl = document.getElementById("fIn");
      const dInEl = document.getElementById("dIn");
      const rows = [];
      const gcd = (a, b) => (b ? gcd(b, a % b) : a);
      const roundNearest = (v, d) => Math.round(v * d) / d;

      const mixed = (val, d) => {
        const sign = val < 0 ? "-" : "";
        let abs = Math.abs(val);
        abs = roundNearest(abs, d);
        const whole = Math.floor(abs);
        const frac = abs - whole;
        if (frac === 0) return sign + whole;
        let num = Math.round(frac * d);
        let den = d;
        const g = gcd(num, den);
        num /= g;
        den /= g;
        return sign + (whole ? whole + " " : "") + num + "/" + den;
      };

      const in2ft = (inches) => ({
        ft: Math.floor(inches / 12),
        in: inches % 12,
      });

      function parseFrac(str) {
        str = str.trim();
        if (/^\-?\d+\s+\d+\/\d+$/.test(str)) {
          const [whole, frac] = str.split(/\s+/);
          const [num, den] = frac.split("/");
          if (parseInt(den) === 0) throw new SyntaxError("Invalid fraction");
          return (
            Math.sign(parseFloat(whole)) *
            (Math.abs(parseFloat(whole)) + parseInt(num) / parseInt(den))
          );
        }
        if (/^-?\d+\/\d+$/.test(str)) {
          const [num, den] = str.split("/");
          if (parseInt(den) === 0) throw new SyntaxError("Invalid fraction");
          return parseInt(num) / parseInt(den);
        }
        return parseFloat(str);
      }

      const pre = (s) =>
        normalize(s)
          .replace(
            RX_MIXED,
            (m, f, i) => parseFrac(f) * 12 + (i ? parseFrac(i) : 0)
          )
          .replace(RX_FT, (m, f) => parseFrac(f) * 12)
          .replace(RX_IN, (m, i) => parseFrac(i))
          .replace(RX_MIXED_FRAC, (m, w, f) => `(${w}+(${f}))`)
          .replace(RX_PURE_FRAC, (m) => `(${m})`);

      const evaluate = (expr) => {
        if (/[^0-9+\-*/().'"\s]/.test(expr)) {
          throw new SyntaxError("Invalid input");
        }
        return Function(`"use strict";return (${expr})`)();
      };

      const parseInput = (s) => {
        const val = evaluate(pre(s));
        if (typeof val !== "number" || !Number.isFinite(val)) {
          throw new SyntaxError("Invalid result");
        }
        return val;
      };

      const outputs = (tot) => {
        const sign = tot < 0 ? "-" : "";
        const abs = Math.abs(tot);
        let { ft, in: inch } = in2ft(abs);
        inch = roundNearest(inch, DEN);
        if (inch >= 12) {
          ft++;
          inch -= 12;
        }
        return {
          fFt: `${sign}${mixed(ft, DEN)}'-${mixed(inch, DEN)}"`,
          dFt: `${sign}${(abs / 12)
            .toFixed(5)
            .replace(/\.0+$|(?<=\d)0+$/, "")}'`,
          fIn: `${sign}${mixed(abs, DEN)}"`,
          dIn: `${sign}${abs.toFixed(5).replace(/\.0+$|(?<=\d)0+$/, "")}"`,
          raw: tot,
        };
      };

      function clearLiveOutputs() {
        [fFtEl, dFtEl, fInEl, dInEl].forEach((el) => {
          el.textContent = "";
        });
      }

      function refreshLive() {
        err.textContent = "";
        const expr = box.value.trim();
        if (!expr) {
          clearLiveOutputs();
          liveRow.classList.add("placeholder");
          return;
        }
        liveRow.classList.remove("placeholder");
        try {
          const out = outputs(parseInput(expr));
          fFtEl.textContent = out.fFt;
          dFtEl.textContent = out.dFt;
          fInEl.textContent = out.fIn;
          dInEl.textContent = out.dIn;
        } catch (e) {
          clearLiveOutputs();
        }
      }

      async function copyText(text) {
        if (!text) return;
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      async function copyCalculatedValue(target) {
        const value =
          target instanceof HTMLInputElement
            ? target.value.trim()
            : target.classList.contains("input-copy")
            ? target.querySelector(".expr").textContent.trim()
            : target.textContent.trim();
        if (!value) return;
        try {
          await copyText(value);
          err.textContent = `Copied: ${value}`;
        } catch {
          err.textContent = "Could not copy to clipboard.";
        }
      }

      box.addEventListener("input", () => {
        err.textContent = "";
        refreshLive();
      });

      box.addEventListener("dblclick", () => {
        copyCalculatedValue(box);
      });

      box.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const expr = box.value.trim();
        if (!expr) {
          err.textContent = "Input cannot be empty.";
          return;
        }
        try {
          const tot = parseInput(expr);
          addRow(expr, tot);
          box.value = "";
          err.textContent = "";
          refreshLive();
        } catch (ex) {
          err.textContent = ex.message || ex;
        }
      });

      document.addEventListener("click", (e) => {
        const cell = e.target.closest(".calc-value");
        if (cell) {
          copyCalculatedValue(cell);
          return;
        }

        const inputCell = e.target.closest(".input-copy");
        if (inputCell && !e.target.closest(".del")) {
          copyCalculatedValue(inputCell);
        }
      });

      function addRow(expr, tot) {
        const out = outputs(tot);
        const tpl = document.getElementById("row-tpl").content.cloneNode(true);
        const tr = tpl.querySelector("tr");
        tr.dataset.inches = tot;
        tr.querySelector(".expr").textContent = expr;
        tr.querySelector(".fFeet").textContent = out.fFt;
        tr.querySelector(".dFt").textContent = out.dFt;
        tr.querySelector(".fInch").textContent = out.fIn;
        tr.querySelector(".dIn").textContent = out.dIn;
        tr.querySelector(".del").addEventListener("click", () => {
          historyBody.removeChild(tr);
          rows.splice(rows.indexOf(tr), 1);
        });
        historyBody.insertBefore(tr, liveRow.nextSibling);
        rows.push(tr);
      }

      function refreshHistory() {
        rows.forEach((tr) => {
          const out = outputs(parseFloat(tr.dataset.inches));
          tr.querySelector(".fFeet").textContent = out.fFt;
          tr.querySelector(".dFt").textContent = out.dFt;
          tr.querySelector(".fInch").textContent = out.fIn;
          tr.querySelector(".dIn").textContent = out.dIn;
        });
      }

      function setDen(idx) {
        active = idx;
        DEN = dens[idx];
        tolBtns.forEach((b, i) => {
          const isActive = i === idx;
          b.classList.toggle("active", isActive);
          b.setAttribute("aria-pressed", String(isActive));
        });
        refreshLive();
        refreshHistory();
      }

      tolBtns.forEach((b, i) => b.addEventListener("click", () => setDen(i)));
      document.addEventListener("keydown", (e) => {
        if (
          (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
          document.activeElement !== box
        ) {
          const dir = e.key === "ArrowLeft" ? -1 : 1;
          setDen((active + dir + dens.length) % dens.length);
        }
      });

      refreshLive();
    </script>
  </body>
</html>
