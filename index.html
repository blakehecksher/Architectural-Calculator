<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Light only, on purpose: pinning the scheme stops a phone in dark mode
         from re-tinting the page or the form controls. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fffcf0" />
    <title>Feet &amp; Inches Calculator</title>
    <style>
      :root {
        color-scheme: light;

        /* ---------- Flexoki ---------- */
        --bg: #fffcf0; /* paper */
        --bg-2: #f2f0e5; /* base-50 */
        --ui: #e6e4d9; /* base-100 */
        --ui-2: #dad8ce; /* base-150 */
        --ui-3: #cecdc3; /* base-200 */
        --tx: #100f0f; /* black */
        --tx-2: #6f6e69; /* base-600 */
        --tx-3: #575653; /* base-700 */

        /* accent colours */
        --re: #af3029;
        --or: #bc5215;
        --ye: #ad8301;
        --gr: #66800b;
        --cy: #24837b;
        --bl: #205ea6;
        --pu: #5e409d;
        --ma: #a02f6f;

        --shadow-1: 0 1px 2px rgba(16, 15, 15, 0.05);
        --shadow-2: 0 1px 2px rgba(16, 15, 15, 0.05),
          0 8px 20px rgba(16, 15, 15, 0.06);
        --press: rgba(16, 15, 15, 0.12);

        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 15px;
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px 20px 40px;
        background: var(--bg);
        color: var(--tx);
        -webkit-tap-highlight-color: transparent;
      }

      /* ---------- header ---------- */
      .app-bar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }

      /* ---------- precision selector ----------
         On the web these read as tabs sitting on top of the table: the label
         sits over the Input column and the chips span the results half, so
         each pair lines up under Feet / Inches. The table is fixed-layout
         with 8 equal columns and Input spans 4, so the results group starts
         at exactly 50% — hence the width below. */
      /* The tabs sit *on top of* the card rather than inside it: the block
         protrudes above the card's top edge over the results half, and its
         bottom laps the card's border so the two share one outline. */
      .tol-bar {
        display: flex;
        justify-content: flex-end;
        position: relative;
        z-index: 1;
        margin-bottom: -1px;
      }

      .tol-tabs {
        display: flex;
        /* spans exactly the results half, so each segment lands under
           Feet / Inches */
        width: 50%;
        background: var(--bg-2);
        border: 1px solid var(--ui-2);
        border-bottom: none;
        border-radius: var(--radius) var(--radius) 0 0;
        overflow: hidden;
      }

      .tol-btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 7px 2px 8px;
        /* one block, split by dividers rather than separate chips */
        border: none;
        border-left: 1px solid var(--ui-2);
        border-radius: 0;
        background: var(--bg-2);
        color: var(--tx-3);
        cursor: pointer;
        user-select: none;
        font-family: inherit;
        font-size: 12.5px;
        line-height: 18px;
        text-align: center;
        white-space: nowrap;
        transition: background-color 0.12s ease, color 0.12s ease,
          border-color 0.12s ease;
      }

      .tol-btn:first-child {
        border-left: none;
      }

      .tol-btn:hover {
        background: var(--bg);
        color: var(--tx);
      }

      .tol-btn.active {
        background: var(--tx);
        border-color: var(--tx);
        color: var(--bg);
        font-weight: 600;
      }

      :focus-visible {
        outline: 2px solid var(--bl);
        outline-offset: 2px;
      }

      /* ---------- message bar ---------- */
      .msg-bar {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 20px;
        margin-bottom: 8px;
        font-size: 12.5px;
      }

      .error {
        color: var(--re);
      }

      .status {
        color: var(--gr);
      }

      /* ---------- history card ---------- */
      .history {
        border: 1px solid var(--ui-2);
        border-radius: var(--radius);
        /* the tab block sitting above supplies this corner */
        border-top-right-radius: 0;
        background: var(--bg);
        box-shadow: var(--shadow-2);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        padding: 9px 10px;
        text-align: left;
        vertical-align: middle;
        border-bottom: 1px solid var(--ui);
      }

      th {
        background: var(--bg-2);
        color: var(--tx-3);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        border-bottom: 1px solid var(--ui-2);
      }

      /* hairline between the input group and the results group */
      thead tr:first-child th:first-child,
      tbody td:first-child {
        border-right: 1px solid var(--ui);
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr {
        transition: background-color 0.12s ease;
      }

      tbody tr:hover {
        background: color-mix(in srgb, var(--bg-2) 55%, transparent);
      }

      .calc-value {
        text-align: right;
        color: var(--tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* keeps rows from collapsing before there's anything to show */
      .calc-value:empty::after {
        content: "—";
        color: var(--ui-3);
      }

      /* ---------- live row / display ---------- */
      #liveRow,
      #liveRow:hover {
        background: var(--bg-2);
      }

      .input-cell {
        position: relative;
      }

      #liveInputCell {
        padding: 6px 8px;
      }

      /* the calculator readout: an input that always follows its caret,
         with edge fades marking text scrolled out of view */
      .display {
        position: relative;
        display: block;
        border: 1px solid var(--ui-2);
        border-radius: 7px;
        background: var(--bg);
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }

      .display:focus-within {
        border-color: var(--bl);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--bl) 18%, transparent);
      }

      .display::before,
      .display::after {
        content: "";
        position: absolute;
        top: 1px;
        bottom: 1px;
        width: 22px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s ease;
        border-radius: 6px;
      }

      .display::before {
        left: 1px;
        background: linear-gradient(to right, var(--bg), transparent);
      }

      .display::after {
        right: 1px;
        background: linear-gradient(to left, var(--bg), transparent);
      }

      .display.fade-l::before,
      .display.fade-r::after {
        opacity: 1;
      }

      #box {
        display: block;
        width: 100%;
        border: none;
        background: transparent;
        font: inherit;
        font-size: 16px;
        padding: 7px 10px;
        color: var(--tx);
        outline: none;
        caret-color: var(--bl);
      }

      #box::placeholder {
        color: var(--tx-2);
        opacity: 0.7;
      }

      /* ---------- saved rows ---------- */
      .input-copy {
        padding-right: 34px;
        overflow-wrap: anywhere;
      }

      .expr {
        color: var(--tx);
      }

      .calc-value,
      .input-copy {
        transition: background-color 0.15s ease;
      }

      .calc-value:hover,
      .input-copy:hover {
        cursor: copy;
        background: color-mix(in srgb, var(--ui) 55%, transparent);
      }

      .calc-value:active,
      .input-copy:active {
        background: color-mix(in srgb, var(--ui) 85%, transparent);
      }

      /* Inset shadow rather than background, so the flash sits *over* whatever
         the cell's own background is (the mobile expression bar is tinted). */
      @keyframes copied {
        from {
          box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--gr) 30%, transparent);
        }
        to {
          box-shadow: inset 0 0 0 999px transparent;
        }
      }

      .copied {
        animation: copied 0.65s ease-out;
      }

      @keyframes row-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .row-in {
        animation: row-in 0.18s ease-out;
      }

      .del {
        display: flex;
        opacity: 0;
        pointer-events: none;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--ui-3);
        background: var(--bg);
        color: var(--tx-2);
        font: inherit;
        font-size: 11px;
        line-height: 1;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease,
          border-color 0.12s ease, opacity 0.12s ease;
      }

      .del:hover,
      .del:focus-visible {
        background: var(--re);
        border-color: var(--re);
        color: var(--bg);
      }

      tr:hover .del,
      tr:focus-within .del {
        opacity: 1;
        pointer-events: auto;
      }

      /* ---------- empty state + hints ---------- */
      .hints {
        margin: 10px 2px 0;
        font-size: 12px;
        color: var(--tx-3);
        text-align: right;
      }

      .hints kbd {
        font: inherit;
        color: var(--tx-3);
        border: 1px solid var(--ui-2);
        border-radius: 4px;
        padding: 1px 4px;
        background: var(--bg-2);
      }

      /* Tablets get the web layout, but the tabs are boxed into half a
         narrower card — scale the label down and drop the inch mark rather
         than break the alignment with the columns. */
      @media (min-width: 601px) and (max-width: 900px) {
        .tol-btn {
          font-size: clamp(8.5px, 1.6vw, 11.5px);
          padding: 6px 1px 7px;
        }
        .tol-btn .mk {
          display: none;
        }
      }

      /* On-screen keypad is hidden on desktop; shown on small screens. */
      .keypad {
        display: none;
      }

      /* ---------- Mobile layout ---------- */
      @media (max-width: 600px) {
        body {
          padding: 12px 12px 0;
          /* space for the fixed keypad; refined in JS to its real height */
          padding-bottom: 320px;
          -webkit-text-size-adjust: 100%;
        }

        .app-bar {
          margin-bottom: 10px;
        }

        h1 {
          font-size: 1rem;
        }

        /* JS moves the bar into the keypad here, so the precision steps sit
           under your thumb instead of at the top of the screen */
        .tol-bar {
          padding: 0 0 8px;
          margin: 0 auto 8px;
          max-width: 520px;
          z-index: auto;
          background: transparent;
          border-bottom: 1px solid var(--ui-3);
        }
        .tol-tabs {
          gap: 3px;
          width: 100%;
          /* undo the web block: phones keep discrete chips */
          background: transparent;
          border: none;
          border-radius: 0;
          overflow: visible;
        }
        .tol-btn,
        .tol-btn:first-child {
          padding: 9px 0;
          border: 1px solid var(--ui-3);
          border-radius: 7px;
          background: var(--bg);
          /* eight chips share the width, so the label scales with the screen
             rather than spilling out of its button on narrow phones */
          font-size: clamp(9px, 2.55vw, 12px);
          line-height: 1;
        }
        /* eight steps only fit across a phone without the inch mark */
        .tol-btn .mk {
          display: none;
        }

        /* no reserved space until there's actually something to say — the
           readout sits right under the title instead */
        .msg-bar {
          margin: 0;
          min-height: 0;
        }
        .msg-bar.has-msg {
          margin-bottom: 8px;
        }

        .hints {
          display: none;
        }

        /* collapse the wide table into stacked cards */
        thead {
          display: none;
        }
        .history {
          border: none;
          border-radius: 0;
          background: transparent;
          box-shadow: none;
          overflow: visible;
        }
        #tbl,
        #tbl tbody {
          display: block;
          width: 100%;
        }

        #tbl tbody tr {
          display: grid;
          grid-template-columns: 1fr 1fr;
          border: 1px solid var(--ui-2);
          border-radius: var(--radius);
          margin-bottom: 8px;
          background: var(--bg);
          box-shadow: var(--shadow-1);
          overflow: hidden;
        }

        #tbl tbody td {
          display: block;
          border: none;
          border-top: 1px solid var(--ui);
          padding: 8px 10px;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        /* the input / expression cell spans the full card width */
        .input-cell {
          grid-column: 1 / -1;
          border-top: none !important;
          border-right: none !important;
        }
        /* must out-specify #tbl tbody td, or the always-visible delete
           button sits on top of the expression */
        #tbl tbody td.input-copy {
          padding-right: 38px;
          /* tinted bar heads each saved card, so scrolling back through past
             calculations you can pick out the inputs at a glance */
          background: var(--ui);
        }
        #tbl tbody td.input-copy:active {
          background: var(--ui-2);
        }

        /* label + value stacked for each output */
        .calc-value {
          text-align: left;
          font-size: 15px;
          min-height: 2.6em;
          white-space: normal;
        }
        /* the live result is the answer you're looking at — give it size */
        #liveRow .calc-value {
          font-size: 18px;
          font-weight: 600;
        }
        .calc-value::before {
          content: attr(data-label);
          display: block;
          font-size: 10px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--tx-3);
          margin-bottom: 3px;
        }
        /* divider between the two output columns */
        .calc-value:nth-child(even) {
          border-right: 1px solid var(--ui);
        }

        /* live input row = pinned "active" panel */
        #liveRow {
          position: sticky;
          top: 0;
          z-index: 5;
          border-color: var(--ui-3);
          box-shadow: var(--shadow-2);
        }
        #liveInputCell {
          padding: 8px 8px 6px;
        }
        .display {
          background: var(--bg);
        }
        #box {
          /* >=16px keeps iOS from zooming the viewport on focus */
          font-size: 20px;
          padding: 10px 10px;
        }

        /* delete control is always reachable on touch */
        #tbl tbody .del {
          opacity: 1;
          pointer-events: auto;
        }

        /* ---------- keypad ---------- */
        .keypad {
          display: block;
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          background: color-mix(in srgb, var(--ui-2) 88%, var(--bg));
          border-top: 1px solid var(--ui-3);
          padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
          box-shadow: 0 -6px 20px rgba(16, 15, 15, 0.08);
          z-index: 20;
        }
        .keys {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 6px;
          max-width: 520px;
          margin: 0 auto;
        }
        .key {
          font-family: inherit;
          font-size: 23px;
          font-weight: 600;
          line-height: 1;
          padding: 15px 0;
          border: 1px solid var(--ui-3);
          background: var(--bg);
          color: var(--tx);
          border-radius: 9px;
          cursor: pointer;
          user-select: none;
          -webkit-user-select: none;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          box-shadow: 0 1px 0 var(--ui-3), var(--shadow-1);
          transition: transform 0.06s ease, box-shadow 0.06s ease,
            background-color 0.06s ease;
        }
        .key:active {
          transform: translateY(1px);
          box-shadow: none;
          background: color-mix(in srgb, var(--bg) 82%, var(--press));
        }

        /* Colour carries meaning, one hue per job: cyan = unit marks,
           orange = arithmetic, blue = commit, red = clear. Digits stay paper
           so they read as the mass of the pad. */
        /* the prime marks draw small for their point size — size them up so
           they read as clearly as the digits */
        .key.mark {
          font-size: 27px;
          background: var(--cy);
          border-color: var(--cy);
          color: var(--bg);
          box-shadow: 0 1px 0 color-mix(in srgb, var(--cy) 68%, black),
            var(--shadow-1);
        }
        .key.op {
          background: var(--or);
          border-color: var(--or);
          color: var(--bg);
          box-shadow: 0 1px 0 color-mix(in srgb, var(--or) 68%, black),
            var(--shadow-1);
        }
        /* parens are structural, not arithmetic — related but subordinate */
        .key[data-k="("],
        .key[data-k=")"] {
          background: var(--bg);
          border-color: var(--ui-3);
          color: var(--or);
          box-shadow: 0 1px 0 var(--ui-3), var(--shadow-1);
        }
        .key[data-k="0"] {
          grid-column: span 2;
        }
        .key.back {
          grid-column: span 1;
          background: var(--re);
          border-color: var(--re);
          color: var(--bg);
          box-shadow: 0 1px 0 color-mix(in srgb, var(--re) 68%, black),
            var(--shadow-1);
        }
        .key.space {
          grid-column: span 2;
          font-size: 27px;
          background: var(--ui);
          border-color: var(--ui-3);
          color: var(--tx-3);
        }
        .key.equals {
          grid-column: span 2;
          background: var(--bl);
          border-color: var(--bl);
          color: var(--bg);
          box-shadow: 0 1px 0 color-mix(in srgb, var(--bl) 68%, black),
            var(--shadow-1);
        }

        .key.mark:active {
          background: color-mix(in srgb, var(--cy) 84%, black);
        }
        .key.op:active {
          background: color-mix(in srgb, var(--or) 84%, black);
        }
        .key[data-k="("]:active,
        .key[data-k=")"]:active {
          background: color-mix(in srgb, var(--bg) 82%, var(--press));
        }
        .key.back:active {
          background: color-mix(in srgb, var(--re) 84%, black);
        }
        .key.space:active {
          background: var(--ui-2);
        }
        .key.equals:active {
          background: color-mix(in srgb, var(--bl) 84%, black);
        }
        .key.clearing {
          background: color-mix(in srgb, var(--re) 70%, black);
        }
      }

      /* Short phones (SE-class): tighten the pad so the readout and history
         still have room above it. */
      @media (max-width: 600px) and (max-height: 720px) {
        .keypad {
          padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        }
        .keys {
          gap: 5px;
        }
        .key {
          padding: 10px 0;
          font-size: 20px;
        }
        .key.mark,
        .key.space {
          font-size: 23px;
        }
        .tol-bar {
          padding-bottom: 6px;
          margin-bottom: 6px;
        }
        .tol-btn {
          padding: 7px 0;
        }
      }

      /* keypad never intercepts input on devices with a real pointer */
      @media (min-width: 601px) {
        .keypad {
          display: none !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-bar">
      <h1>Feet &amp; Inches Calculator</h1>
    </div>
    <div class="msg-bar">
      <div class="error" id="err" role="alert" aria-live="assertive"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <div class="tol-bar" id="tolBar">
      <div class="tol-tabs" role="group" aria-label="Rounding precision">
        <button class="tol-btn" data-den="2" aria-pressed="false" aria-label="half inch">1/2<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="4" aria-pressed="false" aria-label="quarter inch">1/4<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="8" aria-pressed="false" aria-label="eighth inch">1/8<span class="mk">&#8243;</span></button>
        <button class="tol-btn active" data-den="16" aria-pressed="true" aria-label="sixteenth inch">1/16<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="32" aria-pressed="false" aria-label="thirty-second inch">1/32<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="64" aria-pressed="false" aria-label="sixty-fourth inch">1/64<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="128" aria-pressed="false" aria-label="one hundred twenty-eighth inch">1/128<span class="mk">&#8243;</span></button>
        <button class="tol-btn" data-den="256" aria-pressed="false" aria-label="two hundred fifty-sixth inch">1/256<span class="mk">&#8243;</span></button>
      </div>
    </div>
    <div class="history">
      <table id="tbl">
        <thead>
          <tr>
            <th rowspan="2" colspan="4">Input</th>
            <th colspan="2">Feet</th>
            <th colspan="2">Inches</th>
          </tr>
          <tr>
            <th>Fractional</th>
            <th>Decimal</th>
            <th>Fractional</th>
            <th>Decimal</th>
          </tr>
        </thead>
        <tbody>
          <tr id="liveRow">
            <td id="liveInputCell" class="input-cell" colspan="4">
              <span class="display" id="display">
                <input
                  id="box"
                  placeholder="5&#8217; + 3 1/4&#8243; or (1.5&#8217; * 2)"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  aria-label="Expression"
                  title="Double-click to copy"
                />
              </span>
            </td>
            <td id="fFt" class="calc-value" data-label="Ft-In (frac)" title="Click to copy"></td>
            <td id="dFt" class="calc-value" data-label="Feet (dec)" title="Click to copy"></td>
            <td id="fIn" class="calc-value" data-label="Inches (frac)" title="Click to copy"></td>
            <td id="dIn" class="calc-value" data-label="Inches (dec)" title="Click to copy"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="hints">
      <kbd>Enter</kbd> adds the line below &middot; <kbd>Esc</kbd> clears
      &middot; click any value to copy
    </p>
    <template id="row-tpl">
      <tr data-inches="">
        <td class="input-cell input-copy" colspan="4" title="Click to copy">
          <button class="del" aria-label="Delete row">&times;</button><span class="expr"></span>
        </td>
        <td class="fFeet calc-value" data-label="Ft-In (frac)" title="Click to copy"></td>
        <td class="dFt calc-value" data-label="Feet (dec)" title="Click to copy"></td>
        <td class="fInch calc-value" data-label="Inches (frac)" title="Click to copy"></td>
        <td class="dIn calc-value" data-label="Inches (dec)" title="Click to copy"></td>
      </tr>
    </template>
    <div class="keypad" id="keypad" aria-label="Calculator keypad">
      <div class="keys">
        <button class="key back" data-k="back" aria-label="backspace, hold to clear">&#9003;</button>
        <button class="key mark" data-k="&quot;" aria-label="inch mark">&Prime;</button>
        <button class="key mark" data-k="'" aria-label="feet mark">&prime;</button>
        <button class="key op" data-k="(">(</button>
        <button class="key op" data-k=")">)</button>

        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key op" data-k="/" aria-label="divide">/</button>
        <button class="key op" data-k="*" aria-label="multiply">*</button>

        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key op" data-k="-" aria-label="minus">&minus;</button>
        <button class="key op" data-k="+" aria-label="plus">+</button>

        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key space" data-k=" " aria-label="space">&#9251;</button>

        <button class="key" data-k="0">0</button>
        <button class="key" data-k=".">.</button>
        <button class="key equals" data-k="=" aria-label="calculate">=</button>
      </div>
    </div>
    <script type="module">
      import { parseInput, formatOutputs } from "./calc.js";

      const dens = [2, 4, 8, 16, 32, 64, 128, 256];
      let active = 3;
      let DEN = dens[active];

      // Phones only. 820px used to catch iPads; every phone is <=430px wide
      // in portrait and the smallest tablet is 744px. Keep in sync with the
      // @media blocks above.
      const MOBILE_MQ = "(max-width: 600px)";

      const tolBtns = [...document.querySelectorAll(".tol-btn")];
      const tolBar = document.getElementById("tolBar");
      const historyCard = document.querySelector(".history");
      const box = document.getElementById("box");
      const display = document.getElementById("display");
      const err = document.getElementById("err");
      const statusEl = document.getElementById("status");
      const historyBody = document.querySelector("#tbl tbody");
      const liveRow = document.getElementById("liveRow");
      const fFtEl = document.getElementById("fFt");
      const dFtEl = document.getElementById("dFt");
      const fInEl = document.getElementById("fIn");
      const dInEl = document.getElementById("dIn");
      const rows = [];

      /* ---------- messages ---------- */
      let statusTimer;
      const msgBar = document.querySelector(".msg-bar");
      function syncMsgBar() {
        msgBar.classList.toggle(
          "has-msg",
          !!(err.textContent || statusEl.textContent)
        );
      }
      function setError(msg) {
        err.textContent = msg;
        syncMsgBar();
      }
      function setStatus(msg) {
        statusEl.textContent = msg;
        syncMsgBar();
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => {
          statusEl.textContent = "";
          syncMsgBar();
        }, 1800);
      }

      /* ---------- caret tracking ----------
         An <input> only auto-scrolls to its caret for *native* edits, and
         reassigning .value resets scrollLeft to 0. Since the on-screen keypad
         drives every edit on touch, the readout would otherwise stay parked at
         the start of a long expression while the caret ran off the right edge.
         So measure the text ahead of the caret ourselves and scroll to it. */
      const measureCtx = document.createElement("canvas").getContext("2d");
      let measuredFont = "";

      function textWidth(str) {
        const cs = getComputedStyle(box);
        const font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize}/${cs.lineHeight} ${cs.fontFamily}`;
        if (font !== measuredFont) {
          measureCtx.font = font;
          measuredFont = font;
        }
        return measureCtx.measureText(str).width;
      }

      // Fade the edge the text runs off, so it's obvious there's more of it.
      function updateFades() {
        const max = box.scrollWidth - box.clientWidth;
        display.classList.toggle("fade-l", box.scrollLeft > 1);
        display.classList.toggle("fade-r", max > 1 && box.scrollLeft < max - 1);
      }

      function scrollCaretIntoView() {
        const cs = getComputedStyle(box);
        const view =
          box.clientWidth -
          (parseFloat(cs.paddingLeft) || 0) -
          (parseFloat(cs.paddingRight) || 0);
        if (view <= 0) return;

        const caret = box.selectionEnd ?? box.value.length;
        const caretX = textWidth(box.value.slice(0, caret));
        // keep a little context visible on the side the caret is heading for
        const margin = Math.min(28, view / 4);
        const max = Math.max(0, box.scrollWidth - box.clientWidth);

        let left = box.scrollLeft;
        if (caretX - left > view - margin) left = caretX - view + margin;
        else if (caretX - left < margin) left = caretX - margin;

        box.scrollLeft = Math.max(0, Math.min(left, max));
        updateFades();
      }

      // Selection changes land after the event that caused them, so re-check
      // on the next frame too (arrow keys, pointer drags, focus restores).
      function trackCaret() {
        scrollCaretIntoView();
        requestAnimationFrame(scrollCaretIntoView);
      }

      function clearLiveOutputs() {
        [fFtEl, dFtEl, fInEl, dInEl].forEach((el) => {
          el.textContent = "";
        });
      }

      function refreshLive() {
        const expr = box.value.trim();
        if (!expr) {
          clearLiveOutputs();
          return;
        }
        try {
          const out = formatOutputs(parseInput(expr), DEN);
          fFtEl.textContent = out.fFt;
          dFtEl.textContent = out.dFt;
          fInEl.textContent = out.fIn;
          dInEl.textContent = out.dIn;
        } catch (e) {
          clearLiveOutputs();
          // A result too big to represent is a real answer we can't show, not
          // a typo — say so rather than just going blank.
          if (e instanceof RangeError) setError(e.message);
        }
      }

      // Everything that edits the box funnels through here: recompute, then
      // put the caret back in view.
      function afterEdit() {
        setError("");
        refreshLive();
        trackCaret();
      }

      async function copyText(text) {
        if (!text) return;
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      function flashCopied(el) {
        if (!(el instanceof HTMLElement) || el === box) return;
        el.classList.remove("copied");
        void el.offsetWidth; // restart the animation
        el.classList.add("copied");
        el.addEventListener("animationend", () => el.classList.remove("copied"), {
          once: true,
        });
      }

      async function copyCalculatedValue(target) {
        const value =
          target instanceof HTMLInputElement
            ? target.value.trim()
            : target.classList.contains("input-copy")
            ? target.querySelector(".expr").textContent.trim()
            : target.textContent.trim();
        if (!value) return;
        try {
          await copyText(value);
          setStatus(`Copied ${value}`);
          flashCopied(target);
        } catch {
          setError("Could not copy to clipboard.");
        }
      }

      box.addEventListener("input", afterEdit);
      box.addEventListener("focus", trackCaret);
      box.addEventListener("scroll", updateFades);
      // caret moves that don't change the text (arrows, Home/End, clicks)
      ["keyup", "click", "select", "pointerup"].forEach((evt) =>
        box.addEventListener(evt, trackCaret)
      );

      box.addEventListener("dblclick", () => {
        copyCalculatedValue(box);
      });

      function commitInput() {
        const expr = box.value.trim();
        if (!expr) {
          setError("Input cannot be empty.");
          return;
        }
        try {
          const tot = parseInput(expr);
          addRow(expr, tot);
          box.value = "";
          setError("");
          refreshLive();
          trackCaret();
        } catch (ex) {
          setError(ex.message || ex);
        }
      }

      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter") return commitInput();
        if (e.key === "Escape" && box.value) {
          e.preventDefault();
          box.value = "";
          afterEdit();
        }
      });

      document.addEventListener("click", (e) => {
        const cell = e.target.closest(".calc-value");
        if (cell) {
          copyCalculatedValue(cell);
          return;
        }

        const inputCell = e.target.closest(".input-copy");
        if (inputCell && !e.target.closest(".del")) {
          copyCalculatedValue(inputCell);
        }
      });

      function addRow(expr, tot) {
        const out = formatOutputs(tot, DEN);
        const tpl = document.getElementById("row-tpl").content.cloneNode(true);
        const tr = tpl.querySelector("tr");
        tr.dataset.inches = tot;
        tr.querySelector(".expr").textContent = expr;
        tr.querySelector(".fFeet").textContent = out.fFt;
        tr.querySelector(".dFt").textContent = out.dFt;
        tr.querySelector(".fInch").textContent = out.fIn;
        tr.querySelector(".dIn").textContent = out.dIn;
        tr.querySelector(".del").addEventListener("click", () => {
          historyBody.removeChild(tr);
          rows.splice(rows.indexOf(tr), 1);
        });
        tr.classList.add("row-in");
        tr.addEventListener("animationend", () => tr.classList.remove("row-in"), {
          once: true,
        });
        historyBody.insertBefore(tr, liveRow.nextSibling);
        rows.push(tr);
      }

      function refreshHistory() {
        rows.forEach((tr) => {
          const out = formatOutputs(parseFloat(tr.dataset.inches), DEN);
          tr.querySelector(".fFeet").textContent = out.fFt;
          tr.querySelector(".dFt").textContent = out.dFt;
          tr.querySelector(".fInch").textContent = out.fIn;
          tr.querySelector(".dIn").textContent = out.dIn;
        });
      }

      function setDen(idx) {
        active = idx;
        DEN = dens[idx];
        tolBtns.forEach((b, i) => {
          const isActive = i === idx;
          b.classList.toggle("active", isActive);
          b.setAttribute("aria-pressed", String(isActive));
        });
        refreshLive();
        refreshHistory();
      }

      /* ---------- on-screen keypad (touch / small screens) ---------- */
      const keypad = document.getElementById("keypad");
      const buzz = (ms) => navigator.vibrate?.(ms);

      function insertAtCursor(text) {
        box.focus();
        const start = box.selectionStart ?? box.value.length;
        const end = box.selectionEnd ?? box.value.length;
        if (box.setRangeText) {
          box.setRangeText(text, start, end, "end");
        } else {
          box.value = box.value.slice(0, start) + text + box.value.slice(end);
          const pos = start + text.length;
          box.setSelectionRange(pos, pos);
        }
        afterEdit();
      }

      function backspace() {
        box.focus();
        let start = box.selectionStart ?? box.value.length;
        const end = box.selectionEnd ?? box.value.length;
        if (start === end) {
          if (start === 0) return;
          start -= 1;
        }
        box.value = box.value.slice(0, start) + box.value.slice(end);
        box.setSelectionRange(start, start);
        afterEdit();
      }

      function clearAll() {
        box.focus();
        box.value = "";
        afterEdit();
      }

      // Keep the caret in the input when tapping keys (prevents blur/flicker).
      // Covers the precision chips too, now that they ride on the keypad.
      keypad.addEventListener("mousedown", (e) => {
        if (e.target.closest(".key, .tol-btn")) e.preventDefault();
      });

      // Hold backspace to wipe the line — the usual calculator "clear".
      let holdTimer;
      let didHoldClear = false;
      const backKey = keypad.querySelector(".key.back");

      backKey.addEventListener("pointerdown", () => {
        didHoldClear = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          didHoldClear = true;
          backKey.classList.add("clearing");
          buzz(15);
          clearAll();
        }, 500);
      });

      ["pointerup", "pointercancel", "pointerleave"].forEach((evt) =>
        backKey.addEventListener(evt, () => {
          clearTimeout(holdTimer);
          backKey.classList.remove("clearing");
        })
      );

      keypad.addEventListener("click", (e) => {
        const key = e.target.closest(".key");
        if (!key) return;
        buzz(8);
        if (key.classList.contains("back")) {
          if (didHoldClear) {
            didHoldClear = false;
            return;
          }
          return backspace();
        }
        if (key.classList.contains("equals")) return commitInput();
        insertAtCursor(key.dataset.k);
      });

      // Suppress the native virtual keyboard when the custom pad is active,
      // and reserve page space so the fixed keypad never covers content.
      const touchMode = window.matchMedia(MOBILE_MQ);
      function syncTouchMode() {
        if (touchMode.matches) {
          box.setAttribute("inputmode", "none");
          // precision steps belong within thumb reach, on top of the keys
          if (tolBar.parentElement !== keypad) keypad.prepend(tolBar);
          document.body.style.paddingBottom = keypad.offsetHeight + 16 + "px";
        } else {
          box.removeAttribute("inputmode");
          // on the web they're tabs sitting on top of the results columns
          if (tolBar.nextElementSibling !== historyCard) historyCard.before(tolBar);
          document.body.style.paddingBottom = "";
        }
        trackCaret();
      }
      touchMode.addEventListener("change", syncTouchMode);
      window.addEventListener("resize", syncTouchMode);
      syncTouchMode();

      tolBtns.forEach((b, i) => b.addEventListener("click", () => setDen(i)));
      // Arrows step precision only when the caret isn't in the box — inside it
      // they belong to the text.
      document.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        if (document.activeElement === box) return;
        const dir = e.key === "ArrowLeft" ? -1 : 1;
        setDen((active + dir + dens.length) % dens.length);
      });

      refreshLive();
      box.focus({ preventScroll: true });
    </script>
  </body>
</html>
